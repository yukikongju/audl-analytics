version: 2

models:
  - name: mart_player_game_stats
    description: >
      Comprehensive individual box score: one row per player, per team, per game.
      Point/second counts come from fct_point_lineups (game-accurate team assignment);
      offensive/defensive/pull metrics from fct_throws and fct_pulls.
    columns:
      - name: ext_game_id
        description: External AUDL game id.
        data_tests: [not_null]
      - name: game_date
        description: Date the game was played (parsed from ext_game_id).
      - name: team_id
        description: AUDL team id (team_season_id) the player played for in this game.
        data_tests: [not_null]
      - name: ext_team_id
        description: External AUDL team slug (as-played that season), mapped from dim_teams.
      - name: opponent_team_id
        description: AUDL team id (team_season_id) of the opponent in this game.
      - name: opponent_ext_team_id
        description: External AUDL team slug (as-played that season) of the opponent, mapped from dim_teams.
      - name: ext_player_id
        description: External AUDL player (roster) id.
        data_tests: [not_null]

  - name: mart_player_game_throws
    description: >
      Thrower -> receiver connection distribution: one row per
      (season, game, thrower, receiver) with per-throw-type completed/attempted counts.
      Only throws with a known receiver are included.
    columns:
      - name: ext_game_id
        data_tests: [not_null]
      - name: offense_team_id
        description: AUDL team id (team_season_id) of the throwing (offense) team.
        data_tests: [not_null]
      - name: offense_ext_team_id
        description: External slug of the offense team (as-played), mapped from dim_teams.
      - name: defense_team_id
        description: AUDL team id (team_season_id) of the defending team.
        data_tests: [not_null]
      - name: defense_ext_team_id
        description: External slug of the defense team (as-played), mapped from dim_teams.
      - name: ext_thrower_id
        data_tests: [not_null]
      - name: ext_receiver_id
        data_tests: [not_null]

  - name: mart_team_game_stats
    description: >
      Team-level box score and efficiency: one row per team, per game (two rows per game).
      Counting stats rolled up from mart_player_game_stats; possession/red-zone metrics and
      conversion rates sourced from the authoritative fct_games columns.
    columns:
      - name: ext_game_id
        data_tests: [not_null]
      - name: season
        description: Season year the game was played.
      - name: game_date
        description: Date the game was played (parsed from ext_game_id).
      - name: team_id
        data_tests: [not_null]
      - name: opponent_team_id
        data_tests: [not_null]
